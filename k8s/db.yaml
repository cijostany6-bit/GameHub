# =========================================================
# MySQL 8.4 — a StatefulSet with a volume claim template.
#
# Why a StatefulSet and not a Deployment: the database needs a
# stable name (gamehub-db) and a stable volume. A Deployment
# would give a random pod name and no identity, and two pods
# would fight over one data directory. One replica, one
# identity, one volume — and no pretending this is HA.
#
# The seed runs from the ConfigMap mounted at
# /docker-entrypoint-initdb.d (k8s/db-init-configmap.yaml is
# generated from db/init.sql by scripts/build-k8s-dbinit.sh),
# and only on first start of an empty data directory — the
# same contract MySQL has in docker-compose.yml.
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: gamehub-db
  namespace: gamehub
  labels:
    app.kubernetes.io/name: gamehub-db
    app.kubernetes.io/part-of: gamehub
spec:
  # Headless: the StatefulSet's stable network identity. Clients
  # still resolve gamehub-db to the pod IP, which is all the app
  # needs.
  clusterIP: None
  selector:
    app.kubernetes.io/name: gamehub-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gamehub-db
  namespace: gamehub
  labels:
    app.kubernetes.io/name: gamehub-db
    app.kubernetes.io/part-of: gamehub
spec:
  serviceName: gamehub-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gamehub-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamehub-db
        app.kubernetes.io/part-of: gamehub
    spec:
      securityContext:
        fsGroup: 999 # mysql group in the official image: the volume must be writable
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - configMapRef:
                name: gamehub-config
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamehub-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamehub-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: gamehub-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: gamehub-config
                  key: DB_USER
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: gamehub-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
