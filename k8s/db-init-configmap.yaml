apiVersion: v1
kind: ConfigMap
metadata:
  name: gamehub-db-init
  namespace: gamehub
  labels:
    app.kubernetes.io/part-of: gamehub
data:
  init.sql: |
    -- =========================================================
    -- GameHub — database bootstrap (runs ONCE, on first start
    -- of an empty MySQL data volume)
    -- =========================================================

    CREATE TABLE IF NOT EXISTS games (
        id          INT AUTO_INCREMENT PRIMARY KEY,
        name        VARCHAR(100) NOT NULL UNIQUE,
        category    VARCHAR(32)  NOT NULL,
        description VARCHAR(255) NOT NULL,
        created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        INDEX idx_games_category (category)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Seed data — categories must match the filter buttons in
    -- frontend/games.html: Action | Racing | Strategy
    INSERT INTO games (name, category, description) VALUES
        ('Cyber Strike',      'Action',   'Neon-drenched tactical shooter set in a corporate-ruled megacity.'),
        ('Neon Rivals',       'Racing',   'Anti-gravity street racing through holographic night districts.'),
        ('Shadow Protocol',   'Strategy', 'Turn-based espionage command: manage agents, intel and safehouses.'),
        ('Plasma Siege',      'Action',   'Cooperative arena shooter against waves of rogue security drones.'),
        ('Turbo Drift Zero',  'Racing',   'Arcade drift championship across zero-gravity mountain passes.'),
        ('Iron Dominion',     'Strategy', 'Build, supply and defend a faction in a persistent war economy.'),
        ('Void Hunters',      'Action',   'Fast-paced bounty hunting aboard a derelict generation ship.'),
        ('Apex Circuit',      'Racing',   'Simulation-grade league racing with dynamic weather and damage.'),
        ('Cipher State',      'Strategy', 'Outsmart rival hackers in a real-time network-control board game.'),
        ('Rift Breakers',     'Action',   'Portal-jumping cooperative brawler with permadeath runs.'),
        ('Velocity Punk',     'Racing',   'Bootleg street racing where the soundtrack sets your top speed.'),
        ('Grid Commander',    'Strategy', 'Command an orbital grid of satellites in a cold-war tower defence.')
    ON DUPLICATE KEY UPDATE
        category   = VALUES(category),
        description = VALUES(description);

    -- ---------------------------------------------------------
    -- Personal bests (Phase 7). Deliberately ONE row per
    -- (player, game) instead of an append-only score log:
    -- data minimisation is a GDPR principle, and the app only
    -- ever needs the best number. `user_sub` is Cognito's
    -- opaque subject — no email, no name, nothing reversible.
    -- The row is deleted when the player deletes their account
    -- (DELETE /api/me), which is the whole point of the feature.
    --
    -- Existing databases (no re-init) get this from
    -- db/migrations/001_personal_bests.sql via scripts/migrate.sh.
    -- ---------------------------------------------------------
    CREATE TABLE IF NOT EXISTS personal_bests (
        user_sub   VARCHAR(64)  NOT NULL,
        game       VARCHAR(100) NOT NULL,
        score      INT UNSIGNED NOT NULL,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                              ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (user_sub, game),
        INDEX idx_personal_bests_game (game, score DESC)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
