# =========================================================
# nginx serving the UI and proxying /api to the backend.
#
# Exposed as a NodePort on 30080 because kind publishes that
# node port on host 8080 (k8s/kind-config.yaml) — so the app
# answers on the same URL as the Compose stack.
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: gamehub-frontend
  namespace: gamehub
  labels:
    app.kubernetes.io/name: gamehub-frontend
    app.kubernetes.io/part-of: gamehub
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gamehub-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamehub-frontend
  namespace: gamehub
  labels:
    app.kubernetes.io/name: gamehub-frontend
    app.kubernetes.io/part-of: gamehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gamehub-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamehub-frontend
        app.kubernetes.io/part-of: gamehub
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: gamehub-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          securityContext:
            # The official nginx image starts a root master process that
            # chowns its cache directories, writes the PID file and drops
            # its workers to uid 101. Drop everything, then add back only
            # the capabilities that master process genuinely needs:
            #   CHOWN/DAC_OVERRIDE  → cache dirs + PID file
            #   SETUID/SETGID       → the worker user
            #   NET_BIND_SERVICE    → binding port 80
            # Dropping ALL of them (the intuitive hardening) makes nginx
            # exit with: chown("/var/cache/nginx/client_temp", 101) failed
            # (1: Operation not permitted) — verified, not guessed.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
