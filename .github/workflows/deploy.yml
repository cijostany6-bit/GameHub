name: Deploy

# =========================================================
# GameHub — Deploy
#
# This workflow does not run on every push. It runs when the
# CI workflow has finished on main and succeeded
# (`workflow_run` + `conclusion == 'success'`), which gives the
# pipeline one property that matters more than speed:
#
#   nothing reaches production that CI has not passed on the
#   exact commit being deployed.
#
# The checkout below uses the CI run's head SHA, not the current
# tip of main. If two merges land close together, the deploy
# ships the commit that was tested, never a later untested one.
#
# Credentials come from GitHub's OIDC token (short-lived) — there
# are no AWS keys in the repository and none on the host.
#
# Jobs
#   1  frontend  build → S3 → CloudFront invalidation
#   2  backend   git pull + compose up + schema migration, over SSM
#   3  verify    smoke test against the public URL (the real edge)
# =========================================================

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # required for the OIDC exchange

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SITE_BUCKET: ${{ vars.SITE_BUCKET }}
  DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
  INSTANCE_ID: ${{ vars.INSTANCE_ID }}
  COGNITO_REGION: ${{ vars.AWS_REGION }}
  COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
  COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}

jobs:

  # ---------------------------------------------------------------
  # Static site → S3, cache invalidated
  # ---------------------------------------------------------------
  frontend:
    name: Publish site (S3 + CloudFront)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Green CI on main, or a human pressing the button.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy what CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deployable frontend
        run: ./scripts/build-frontend.sh

      - name: Sync assets (long cache)
        run: |
          aws s3 sync build/frontend/ "s3://$SITE_BUCKET/" \
            --delete \
            --exclude "*.html" \
            --exclude ".DS_Store" \
            --cache-control "public, max-age=604800"

      - name: Sync HTML (short cache)
        run: |
          aws s3 sync build/frontend/ "s3://$SITE_BUCKET/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$ID"

  # ---------------------------------------------------------------
  # API host → git pull + compose up + migrate, over SSM
  # (no SSH port, no key pair, no stored credentials)
  # ---------------------------------------------------------------
  backend:
    name: Deploy API host (SSM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out the compose stack and bring the schema up to date
        run: |
          cat > params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "cd /opt/gamehub",
              "git fetch --all",
              "git checkout main",
              "git pull --ff-only",
              "docker compose up -d --build",
              "for i in $(seq 1 45); do docker compose exec -T db mysqladmin ping --silent && break; sleep 2; done",
              "./scripts/migrate.sh",
              "docker compose ps"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GameHub deploy ${GITHUB_SHA}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "--- deploy output ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed (status: $STATUS)"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

  # ---------------------------------------------------------------
  # Post-deploy verification — against the PUBLIC url.
  #
  # A deploy is not done when the command exits 0; it is done when
  # the thing a player would reach answers correctly. This checks
  # the edge (CloudFront), not the host behind it, so it catches a
  # broken origin, a bad certificate or a stale cache as well as a
  # crashed container.
  # ---------------------------------------------------------------
  verify:
    name: Verify the public deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend, backend]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the distribution domain
        run: |
          SITE_URL=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query "Distribution.DomainName" --output text)
          echo "SITE_URL=https://$SITE_URL" >> "$GITHUB_ENV"
          echo "Verifying $SITE_URL"

      - name: Wait for the site and the API to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$SITE_URL/api/health" >/dev/null 2>&1; then
              echo "API healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy"
          curl -sS -o /dev/null -w "last status: %{http_code}\n" \
            "$SITE_URL/api/health" || true
          exit 1

      # The first version of this step asserted that an anonymous
      # /api/games answered 200 with 12 games. It never passed: in
      # production the catalogue is behind the auth gate and answers
      # 401 — which is the gate *working*. The check was wrong, not
      # the deployment. It now asserts the gate is on, then signs in
      # and uses a real token, so it covers JWKS verification and the
      # database as well as the edge.
      - name: Smoke test the deployed edge
        env:
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: |
          set -e
          fail() { echo "FAIL: $1"; exit 1; }

          # 1. The app shell is served by the CDN.
          curl -fsS "$SITE_URL/" -o /tmp/home.html
          grep -qi "GameHub" /tmp/home.html || fail "home page has no GameHub markup"
          grep -qi "ENTER THE" /tmp/home.html || fail "home page is not the real hero"

          # 2. The documentation ships with the app, under /learn/. The
          #    marker must exist only on the docs landing page: "GameHub"
          #    is on both pages, which is how this check once passed while
          #    /learn/ was serving the game hub's home page.
          curl -fsS "$SITE_URL/learn/" -o /tmp/learn.html
          grep -q 'readme\.html' /tmp/learn.html \
            || fail "/learn/ is not the documentation landing page"
          curl -fsS "$SITE_URL/learn/gamehub-guide.pdf" -o /tmp/guide.pdf
          [ "$(wc -c < /tmp/guide.pdf)" -gt 100000 ] || fail "the PDF is truncated"
          [ "$(head -c 5 /tmp/guide.pdf)" = "%PDF-" ] || fail "the PDF is not a PDF"

          # 3. The auth gate is on: without a token, protected routes
          #    must be refused, not silently allowed.
          for path in /api/games /api/me; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$SITE_URL$path")
            [ "$STATUS" = "401" ] \
              || fail "expected 401 from $path unauthenticated, got $STATUS"
          done

          # 4. Sign in as the smoke identity, exactly as a browser does,
          #    and exercise the routes a player needs.
          [ -n "$SMOKE_USER_EMAIL" ] \
            || fail "SMOKE_USER_EMAIL is not configured (a repository secret)"
          ID_TOKEN=$(aws cognito-idp initiate-auth \
            --client-id "$COGNITO_CLIENT_ID" \
            --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters \
            "USERNAME=$SMOKE_USER_EMAIL,PASSWORD=$SMOKE_USER_PASSWORD" \
            --query "AuthenticationResult.IdToken" --output text)
          [ -n "$ID_TOKEN" ] || fail "the smoke user could not sign in"

          # 5. The catalogue is real data from the database: 12 entries.
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" \
            "$SITE_URL/api/games" -o /tmp/games.json
          COUNT=$(python3 -c \
            "import json;print(len(json.load(open('/tmp/games.json'))))")
          [ "$COUNT" -eq 12 ] || fail "expected 12 games, got $COUNT"

          # 6. The token identifies the right player.
          curl -fsS -H "Authorization: Bearer $ID_TOKEN" \
            "$SITE_URL/api/me" -o /tmp/me.json
          python3 -c "import json,sys; \
            sys.exit(0 if json.load(open('/tmp/me.json')).get('sub') else 1)" \
            || fail "/api/me did not identify the signed-in user"

          # 7. Every catalogue title resolves to a real game record.
          for id in 1 6 12; do
            curl -fsS -H "Authorization: Bearer $ID_TOKEN" \
              "$SITE_URL/api/games/$id" -o /dev/null \
              || fail "/api/games/$id is not served"
          done

          echo "Post-deploy smoke test passed: edge, docs site, auth gate," \
               "authenticated catalogue, game details."
