# =========================================================
# GameHub — CI
#
# Job 1  test        lint + unit/integration tests + coverage gate
#                     (MySQL as a service container)
# Job 2  stack-smoke builds the REAL Docker images and runs the
#                     full stack end-to-end on the runner
# Job 3  manifests   Kubernetes schema validation + drift check on
#                     the generated DB seed ConfigMap
# Job 4  security    gitleaks (history) + Trivy (fs) + npm audit
# =========================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & tests (Node 22, MySQL service)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: gamehub
          MYSQL_USER: gamehub
          MYSQL_PASSWORD: gamehub_local_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci_root_pw --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: gamehub
      DB_PASSWORD: gamehub_local_pw
      DB_NAME: gamehub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (reproducible — npm ci)
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Load schema and seed data
        run: mysql -h 127.0.0.1 -P 3306 -u gamehub -pgamehub_local_pw gamehub < db/init.sql

      - name: Migrations apply cleanly and are idempotent
        env:
          MIGRATE_VIA: client
        run: |
          ./scripts/migrate.sh
          # The second run must find nothing to do — a migration that
          # reapplies is a migration you cannot trust.
          ./scripts/migrate.sh | tee /tmp/migrate2.log
          grep -q "0 applied now" /tmp/migrate2.log

      - name: Tests with coverage gate (80/80/80)
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend game-engine tests (21 tests, stubbed canvas)
        run: node --test "frontend/test/*.test.js"

  stack-smoke:
    name: Full-stack smoke test (Docker Compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up -d --build

      - name: Wait for backend health, then smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ./scripts/smoke.sh

      - name: Apply migrations (the deployed host does the same after a rollout)
        run: ./scripts/migrate.sh

      - name: Trivy — scan the built image, not just the source tree
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: gamehub-backend:local
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v

  manifests:
    name: Kubernetes manifests (schema + drift)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Database seed ConfigMap matches db/init.sql
        run: ./scripts/build-k8s-dbinit.sh --check

      - name: Validate manifests against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          # Cluster is a kind config, not a manifest; Application is an
          # Argo CD CRD, whose schema is not in the upstream set.
          /tmp/kubeconform -strict -summary -skip Cluster,Application k8s/

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks reviews the FULL history

      - name: Gitleaks — no secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: npm audit — dependency vulnerabilities
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: SBOM — a dependency inventory, kept as a build artifact
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: gamehub-sbom.spdx.json
          artifact-name: gamehub-sbom
          # The action would otherwise open a PR with its own updates.
          upload-artifact: true
          upload-release-assets: false

      - name: Confirm the SBOM is not empty
        run: |
          test -s gamehub-sbom.spdx.json
          echo "packages: $(python3 -c "import json;print(len(json.load(open('gamehub-sbom.spdx.json'))['packages']))")"
