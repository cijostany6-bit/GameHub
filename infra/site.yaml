AWSTemplateFormatVersion: "2010-09-09"

Description: >
  GameHub - static frontend on S3 behind CloudFront (Phase 4).
  The bucket is private; CloudFront reads it through an Origin
  Access Control. Free tier: 1 TB CloudFront + 5 GB S3.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"

  BackendOriginDomain:
    Type: String
    Default: ""
    Description: >
      Public DNS name (or IP) of the EC2 backend. Leave empty to
      deploy the frontend first and set it later — /api/* requests
      only work once this is filled in.

  BackendOriginPort:
    Type: Number
    Default: 8080
    Description: Port nginx listens on inside the EC2 host.

  CustomDomain:
    Type: String
    Default: ""
    Description: >
      Hostname to serve the site on, e.g. gamehub.example.com. Leave empty
      to stay on the distribution's own domain name (which then keeps
      CloudFront's default certificate).

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN of an issued, us-east-1 ACM certificate covering CustomDomain.
      CloudFront only accepts certificates from us-east-1 — the
      gamehub-dns stack issues it there.

  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone that contains CustomDomain.

Conditions:
  HasBackend: !Not [!Equals [!Ref BackendOriginDomain, ""]]

  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomain, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub gamehub-site-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: GameHub

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub gamehub-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub GameHub ${Stage}
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        DefaultRootObject: index.html
        # The human-facing name. Note what adding it costs: a custom
        # certificate replaces CloudFront's default one, so the
        # distribution's own domain name stops answering over HTTPS
        # (and, because the viewer protocol policy redirects HTTP to
        # HTTPS, stops answering usefully at all). That is why every
        # reference in the repository was moved to this name in the
        # same change — ADR-018.
        Aliases: !If
          - HasCustomDomain
          - - !Ref CustomDomain
          - !Ref AWS::NoValue
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - HasBackend
            - Id: api
              DomainName: !Ref BackendOriginDomain
              CustomOriginConfig:
                OriginProtocolPolicy: http-only
                OriginSSLProtocols:
                  - TLSv1.2
                HTTPPort: !Ref BackendOriginPort
                HTTPSPort: 443
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized (managed)
          FunctionAssociations:
            # Only the static behaviour gets the rewrite; /api/* is a
            # separate behaviour and never runs this code.
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionARN
        CacheBehaviors:
          - !If
            - HasBackend
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: redirect-to-https
              # API responses must never be cached at the edge.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled (managed)
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - PATCH
                - POST
                - DELETE
              Compress: true
            - !Ref AWS::NoValue
        CustomErrorResponses:
          # Static hosting: let the SPA-ish site handle unknown paths.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # ---------------------------------------------------------------
  # Directory URLs, resolved at the edge.
  #
  # S3 as a REST origin (which is what an Origin Access Control uses)
  # has no notion of an index document for a "folder": a request for
  # /learn/ asks for the key "learn/", which does not exist. The
  # custom error responses below then hide that 403 behind
  # /index.html — so /learn/ answered 200 with the game hub's landing
  # page. A wrong page wearing a success status is worse than an
  # error, because nothing reports it.
  #
  # Appending index.html to any URI that ends in "/" is exactly what
  # an S3 *website* endpoint would do. Doing it in a viewer-request
  # function instead keeps the bucket honest — no zero-byte "folder"
  # objects that a `--delete` sync has to be taught to spare — and
  # costs nothing at this size: the CloudFront Functions free tier is
  # two million requests a month, and the whole site sees a few
  # thousand.
  # ---------------------------------------------------------------
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub gamehub-${Stage}-directory-index
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "Append index.html to directory-style URLs (${Stage})"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // The API is a separate cache behaviour, so this function
            // should never see these paths. Saying so explicitly means
            // the function stays correct if that routing ever changes.
            if (uri.startsWith("/api/")) {
                return request;
            }

            if (uri.endsWith("/")) {
                // /learn/ → /learn/index.html
                request.uri = uri + "index.html";
            } else if (uri.lastIndexOf(".") < uri.lastIndexOf("/")) {
                // No extension in the last segment: treat it as a
                // directory, so /learn works as well as /learn/.
                request.uri = uri + "/index.html";
            }
            return request;
        }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}
                  - DistId: !Ref Distribution

  # ---------------------------------------------------------------
  # The custom domain in DNS: alias records pointing at the
  # distribution. Alias (not CNAME) means no charge for the queries
  # and it works on the zone apex as well as a subdomain.
  #
  # Z2FDTNDATAQYW2 is CloudFront's fixed hosted-zone id — it is the
  # same number for every distribution in every account, which is why
  # it is written here rather than looked up.
  # ---------------------------------------------------------------
  DomainRecordV4:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordV6:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Description: S3 bucket that receives the frontend artifact.
    Value: !Ref SiteBucket
    Export:
      Name: !Sub gamehub-${Stage}-SiteBucket

  DistributionId:
    Description: CloudFront distribution id (for cache invalidation).
    Value: !Ref Distribution
    Export:
      Name: !Sub gamehub-${Stage}-DistributionId

  SiteUrl:
    Description: Public site URL.
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomain}
      - !Sub https://${Distribution.DomainName}
    Export:
      Name: !Sub gamehub-${Stage}-SiteUrl

  DistributionDomain:
    Description: CloudFront domain (CORS origin for the backend).
    Value: !GetAtt Distribution.DomainName
