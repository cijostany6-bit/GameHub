# =========================================================
# Structured access-log format (http context).
#
# This file lands in /etc/nginx/conf.d/ so it is included
# inside the http {} block — log_format is an http-level
# directive and cannot live in the server block that
# default.conf defines. The "00-" prefix keeps it ahead of
# default.conf, which is what uses the format.
#
# JSON lines let CloudWatch Logs metric filters pull status
# codes and request times as *values* instead of regexes.
# $request_time includes the upstream (Express) call, which
# is the time a user actually waits.
# =========================================================

log_format gamehub_json escape=json
    '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"forwarded_for":"$http_x_forwarded_for"}';
