server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- structured access log -------------------------------------------
    # The format itself is defined at http level in
    # frontend/nginx-log-format.conf (log_format is not allowed inside a
    # server block); this line selects it for this server.
    access_log /var/log/nginx/access.log gamehub_json;

    # --- hardening headers (static responses) ---------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- compression ----------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API reverse proxy ----------------------------------
    location /api/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
